
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Personality Quiz</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container mt-5 mb-5">

    <h1 class="text-center">Anime Personality Quiz</h1>
    <p class="text-center">
      Answer these questions to find out what type of
      anime character you are!
    </p>

    <!-- Question 1 -->
    <div class="question-block card p-3 mb-3">
      <h3>1. What would you do in a fight?</h3>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="fighter">
        Fight back
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="thinker">
        Make a plan
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="protector">
        Protect my friends
      </button>
    </div>

    <!-- Question 2 -->
    <div class="question-block card p-3 mb-3">
      <h3>2. What's your biggest strength?</h3>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="fighter">
        Strength
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="thinker">
        Intelligence
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="protector">
        Loyalty
      </button>
    </div>

    <!-- Question 3 -->
    <div class="question-block card p-3 mb-3">
      <h3>3. What would you rather do?</h3>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="fighter">
        Train to become stronger
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="thinker">
        Solve a mystery
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="protector">
        Hang out with friends
      </button>
    </div>

    <!-- Question 4 -->
    <div class="question-block card p-3 mb-3">
      <h3>4. What matters most to you?</h3>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="fighter">
        Winning
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="thinker">
        Knowledge
      </button>

      <button class="answer-btn btn btn-outline-primary m-1"
              data-answer="protector">
        Friendship
      </button>
    </div>

    <!-- Show Results Button -->
    <div class="text-center">
      <button id="show-results" class="btn btn-success btn-lg">
        Show Results
      </button>
    </div>

    <!-- Quiz Results -->
    <div id="result-container" class="mt-4 text-center"></div>

  </div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JavaScript -->
  <script src="js/script.js"></script>

</body>
</html>
